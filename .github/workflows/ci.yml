name: imgdiff CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc-11, gcc-10]

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          CC=${{ matrix.compiler }} make
      - name: Test
        run: |
          make test
